# Publishes server.json to the official MCP registry.
#
# Runs only on manual dispatch — publishing is a deliberate act, not something
# that should follow every push to main.
#
# Authentication is GitHub Actions OIDC rather than a personal token. The
# registry derives the namespace from the `repository_owner` OIDC claim, which
# is `webweaver-nexus` for this repo, so this grants `io.github.webweaver-nexus/*`
# directly. A personal `mcp-publisher login github` does not: it grants the org
# namespace only when GitHub reports the user as an org Owner via
# `GET /user/memberships/orgs`, and that lookup returns nothing for this org
# even though the account is an Owner. See README "Publishing to the MCP registry".

name: Publish to MCP Registry

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for `mcp-publisher login github-oidc` to mint an OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate via OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
