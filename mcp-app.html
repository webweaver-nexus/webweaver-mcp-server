<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Join the WebWeaver Nexus Waitlist</title>
</head>
<body>
  <main class="main">
    <h2>Join the Waitlist</h2>
    <p class="subtitle">Sign up for early access to WebWeaver Nexus.</p>

    <div id="tally-container">
      <!-- Tally embed loads here via the loader script -->
      <iframe
        data-tally-src="https://tally.so/embed/YOUR_FORM_ID_HERE?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
        loading="lazy"
        width="100%"
        height="300"
        frameborder="0"
        marginheight="0"
        marginwidth="0"
        title="WebWeaver Nexus Waitlist"
      ></iframe>
    </div>

    <p id="confirmation" class="confirmation" hidden>
      You're on the list! We'll be in touch soon.
    </p>
  </main>
  <script type="module" src="/src/mcp-app.ts"></script>
</body>
</html>
